<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#020617"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.15" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="10 15" stroke-opacity="0.3" />

  <!-- Radar sweep lines -->
  <line x1="256" y1="76" x2="256" y2="436" stroke="#475569" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="5 5" />
  <line x1="76" y1="256" x2="436" y2="256" stroke="#475569" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="5 5" />

  <!-- Compass Arrow Geometry -->
  <polygon points="256,120 290,240 256,220 222,240" fill="#10b981" />
  <polygon points="256,392 290,272 256,290 222,272" fill="#6366f1" />

  <!-- Glowing core telemetry point -->
  <circle cx="256" cy="256" r="16" fill="#10b981" />
  <circle cx="256" cy="256" r="32" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.5">
    <animate attributeName="r" values="16;48;16" dur="3s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values="1;0;1" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- Orbital tracks representing inertial sensors (X/Y/Z) -->
  <ellipse cx="256" cy="256" rx="110" ry="40" fill="none" stroke="#38bdf8" stroke-width="3" transform="rotate(-30 256 256)" stroke-opacity="0.8" />
  <ellipse cx="256" cy="256" rx="110" ry="40" fill="none" stroke="#f43f5e" stroke-width="3" transform="rotate(210 256 256)" stroke-dasharray="6 4" stroke-opacity="0.7" />

  <!-- Satellite Signal Arcs -->
  <path d="M 196,150 A 80,80 0 0,1 316,150" fill="none" stroke="#10b981" stroke-dasharray="4 4" stroke-width="4" stroke-linecap="round" />
  <path d="M 166,120 A 120,120 0 0,1 346,120" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8" />
</svg>
