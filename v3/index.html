    <!-- Register/Unregister Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        // Unregister service worker in preview and development environments to avoid stale caching
        const isDev = window.location.hostname.includes('run.app') || window.location.hostname.includes('localhost') || window.location.hostname.includes('127.0.0.1');
        if (isDev) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let registration of registrations) {
              registration.unregister().then(() => {
                console.log('Unregistered Service Worker in development to prevent stale caches.');
              });
            }
          });
          // Also clear Cache Storage in dev
          if ('caches' in window) {
            caches.keys().then((names) => {
              for (let name of names) {
                caches.delete(name);
              }
            });
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
              .then(reg => {
                console.log('Service Worker registered successfully under scope:', reg.scope);
              })
              .catch(err => {
                console.error('Service Worker registration failed:', err);
              });
          });
        }
      }
    </script>
